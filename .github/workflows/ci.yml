name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      DATABASE_URL: postgresql://playaround:playaround@127.0.0.1:5432/playaround_test
      TEST_DATABASE_URL: postgresql://playaround:playaround@127.0.0.1:5432/playaround_test
      JWT_SECRET: ci-only-change-me-jwt-secret-32ch
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: playaround_test
          POSTGRES_USER: playaround
          POSTGRES_PASSWORD: playaround
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U playaround -d playaround_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate test database
        run: pnpm --filter @playaround/api exec prisma migrate deploy

      - name: Lint, typecheck, test, build
        run: pnpm exec turbo run lint typecheck test build
