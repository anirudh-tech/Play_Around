name: playaround

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: playaround
      POSTGRES_USER: playaround
      POSTGRES_PASSWORD: playaround
      TZ: UTC
    ports:
      # Host 5432 is often taken by Postgres.app / EDB / Homebrew. Container stays 5432.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U playaround -d playaround']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

volumes:
  postgres-data:
